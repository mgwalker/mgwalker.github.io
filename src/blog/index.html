---
title: Blog posts
date: null
eleventyExcludeFromCollections: true
---

<ul class="unstyled">
{% for blog in collections.blog reversed %}
  <li class="margin-bottom-2">
    <h3 class="margin-bottom-1"><a href="{{ blog.url }}">{{ blog.data.title }}</a>
      <sub><time datetime="{{ blog.data.date | isodate }}">{{ blog.data.date | datestamp }}</time></sub></h3>
    {% if blog.data.summary %}<p>{{ blog.data.summary }}</p>{% endif %}
  </li>
{% endfor %}
</ul>
