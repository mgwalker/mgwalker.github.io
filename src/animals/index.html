---
title: Alphabet of Animals
---

<div class="grid-container">
  <div class="tablet:grid-row flex-wrap--wrap">
    {% for img in images %}
    <div class="grid-cell-4">
      <a href="/assets/images/animals/{{ img.letter }}.jpg">
        <img
          alt="{{ img.letter}}: {{ img.name }}"
          src="/assets/images/animals/{{ img.letter }}.jpg"
          class="mw-100"
        />
      </a>
    </div>
    {% endfor %}
  </div>
</div>
